# Override with DEVPILOT_ML_BASE_URL when the Python API is hosted elsewhere.
devpilot.ml.base-url=${DEVPILOT_ML_BASE_URL:http://127.0.0.1:8000}

# Keep GROQ_API_KEY in the backend process environment; never expose it to the browser.
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

spring.datasource.url=jdbc:mysql://localhost:3306/devpilot_db
spring.datasource.username=devpilot_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

