# Override with DEVPILOT_ML_BASE_URL when the Python API is hosted elsewhere.
devpilot.ml.base-url=${DEVPILOT_ML_BASE_URL:http://127.0.0.1:8000}

# Keep GROQ_API_KEY in the backend process environment; never expose it to the browser.
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

# Optional Google OAuth login. Keep credentials in environment variables.
devpilot.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
devpilot.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
devpilot.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
devpilot.oauth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
devpilot.oauth.frontend-url=${DEVPILOT_FRONTEND_URL:http://localhost:5173}

# GitHub App credentials remain in the backend environment. Never expose these to the frontend.
devpilot.github.app-id=${GITHUB_APP_ID:}
devpilot.github.private-key=${GITHUB_APP_PRIVATE_KEY:}
devpilot.github.app-slug=${GITHUB_APP_SLUG:}

spring.datasource.url=jdbc:mysql://localhost:3306/devpilot_db
spring.datasource.username=devpilot_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# Enable locally with SPRING_JPA_SHOW_SQL=true when debugging database queries.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

